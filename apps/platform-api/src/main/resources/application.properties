spring.application.name=platform-api
server.port=8080

# Postgres brought up by infra/docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/healthvault
spring.datasource.username=healthvault
spring.datasource.password=${DB_PASSWORD:devpassword}
# Flyway owns the schema now; JPA only validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Expose health for the load balancer and local checks
management.endpoints.web.exposure.include=health,info

# JWT signing. The secret is a credential: keep it in .env, never commit a real one.
security.jwt.secret=${JWT_SECRET:dev-only-change-me-in-production-0123456789}
security.jwt.ttl-seconds=3600

# Upload limits. The container rejects anything larger before it reaches the controller.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Object storage. Default is the local filesystem; activate the "s3" profile for real S3/MinIO.
storage.local.dir=${STORAGE_DIR:${java.io.tmpdir}/healthvault-storage}

# S3 / MinIO settings, only read under the "s3" profile.
storage.s3.bucket=${S3_BUCKET:healthvault}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
