name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ai-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src
      - run: PYTHONPATH=src pytest -q

  platform-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healthvault
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: healthvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthvault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: DB_PASSWORD=devpassword ./gradlew test --no-daemon
